  .card:hover{transform:translateY(-6px);border-color:rgba(77,201,255,.55);background:rgba(255,255,255,.06)}

  .logo{width:96px;height:96px;border-radius:26px;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:floaty 4s ease-in-out infinite}

  .toast{

  .toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(77,201,255,.45)}100%{box-shadow:0 0 0 18px rgba(77,201,255,0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
